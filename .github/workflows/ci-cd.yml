name : DevSecOps CI Pipeline

on:
    push:
        branches:
            - main
            - master
            - test
    pull-request: #proposal to merge a set of code changes into the main branch
        branches:
            - master
    workflow-dispatch:

permissions:
    contents: read



jobs: 
    build-and-scan: 
        runs-on: ubuntu-latest #tells the workflow to run on VM that supports Github

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Build docker image
              uses: |
               docker build -t secure-nginx:latest .

            - name: run Trivy vulnerability scan
              uses: aquasecurity/trivy-action@0.28.0
              with:
                image-ref: secure-nginx:latest
                format: table
                exit-code: '1'
                ignore-unfixed: true
                vuln-type: 'os,library'
                severity: 'CRITICAL,HIGH'